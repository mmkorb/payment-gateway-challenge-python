[project]
name = "payment-gateway-api"
version = "0.1.0"
description = "Payment Gateway API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.161.0,<0.162.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "0.17.2"
mypy = "2.4.0"
coverage = "7.17.0"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.coverage.run]
branch = true
source = ["payment_gateway_api"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
