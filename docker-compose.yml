services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  gateway:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      BANK_URL: http://bank_simulator:8080
    depends_on:
      - bank_simulator

  # Tests, lint and type checks: docker compose run --rm dev <command>
  dev:
    build:
      context: .
      target: dev
    profiles: ["dev"]
    environment:
      BANK_URL: http://bank_simulator:8080
    volumes:
      - .:/app
